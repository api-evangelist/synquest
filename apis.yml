name: SynQuest
description: >-
  SynQuest, Inc. (formerly Nasdaq: SYNQ) was an Atlanta, Georgia based supply-chain
  planning and logistics software company that provided e-business solutions to
  optimize the financial and operational performance of the supply chain, including
  transportation, distribution, and inventory planning and simulation for customers
  such as Ford Motor Company. SynQuest reverse-merged with Viewlocity, Inc. in
  November 2002 (Viewlocity merged into SynQuest as the surviving entity) and was
  delisted from the Nasdaq SmallCap Market shortly after. Insight Partners (formerly
  Insight Venture Partners) was an early investor, which is why the company appears
  in the API Evangelist network as a VC-portfolio lead. The company is inactive today
  and publishes no live website, developer portal, or public API surface; enrichment
  searches found only historical SEC filings and press coverage.
